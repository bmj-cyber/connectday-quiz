<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>친해지길 바라 Quiz Quiz! · 전략실 커넥트데이</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* ===== Kbank Brand Color =====
     Primary #0114A7 · Secondary #4262FF · Grayscale #E0E6F1 #EDF1F7 #F7F9FD #FFFFFF */
  :root{
    --primary:#0114A7; --secondary:#4262FF; --dark-k:#2848DF;
    --g1:#E0E6F1; --g2:#EDF1F7; --g3:#F7F9FD;
    --ink:#0B1446; --ink-body:#3D4870; --ink-mute:#8490B0;
    --ok:#12B76A; --ng:#F04461;
    --gold1:#FFF7D6; --gold2:#FFE08A; --silver1:#F7F9FD; --silver2:#D5DCE8; --bronze1:#FDF0E4; --bronze2:#F0C9A2;
    --ease:cubic-bezier(.22,.61,.36,1);
    --sans:"Pretendard Variable","Pretendard",-apple-system,system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;letter-spacing:0}
  html,body{min-height:100%}
  body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
  button,input,textarea,select{font-family:var(--sans)}
  button{cursor:pointer;border:0}
  button:disabled{cursor:default}
  /* ---------- BACKGROUND : brand blue gradient ---------- */
  .bg{position:fixed;inset:0;z-index:-2;overflow:hidden;
    background:
      radial-gradient(58% 52% at 2% 0%, #8EA2FF 0%, rgba(142,162,255,0) 52%),
      radial-gradient(78% 72% at 2% 106%, #7189FF 0%, rgba(113,137,255,0) 50%),
      radial-gradient(115% 85% at 122% 120%, #B4C1FF 0%, rgba(180,193,255,0) 46%),
      radial-gradient(92% 74% at 76% 44%, #0114A7 0%, rgba(1,20,167,0) 56%),
      linear-gradient(152deg, #1B33D6 0%, #4262FF 46%, #6D86FF 80%, #A3B3FF 100%);}
  .bg::before,.bg::after{content:"";position:absolute;inset:-40%;pointer-events:none}
  .bg::before{background:linear-gradient(180deg,transparent 32%,rgba(1,20,167,.45) 50%,transparent 68%);transform:rotate(-14deg) scaleY(1.5);filter:blur(42px)}
  .bg::after{background:linear-gradient(180deg,transparent 54%,rgba(220,228,255,.45) 65%,transparent 80%);transform:rotate(-15deg) scaleY(1.3);filter:blur(40px)}
  /* ---------- FX ---------- */
  .fx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
  .spot{position:absolute;top:-35%;width:34vw;height:150vh;background:linear-gradient(110deg,transparent 28%,rgba(255,255,255,.28) 49%,transparent 70%);filter:blur(7px);animation:spot 3.4s ease-in-out infinite alternate}
  .spot.l{left:-8%;transform:rotate(20deg)} .spot.r{right:-8%;transform:rotate(-20deg);animation-delay:-1.7s}
  .twinkle{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);background:var(--c);opacity:0;filter:blur(1.4px);box-shadow:0 0 14px 4px var(--c);
    clip-path:polygon(50% 0,61% 36%,100% 50%,61% 64%,50% 100%,39% 64%,0 50%,39% 36%);animation:twinkle var(--t) ease-in-out var(--d) infinite alternate}
  .confetti{position:absolute;top:-12%;left:var(--x);width:10px;height:18px;border-radius:3px;background:var(--c);animation:fall var(--t) linear var(--d) infinite}
  .confetti.dot{width:8px;height:8px;border-radius:50%;box-shadow:0 0 12px 4px var(--c)}
  @keyframes spot{to{opacity:.35;filter:blur(15px)}}
  @keyframes twinkle{0%,18%{opacity:.04;transform:scale(.25) rotate(0)}70%,100%{opacity:.7;transform:translate(var(--dx),var(--dy)) scale(1.15) rotate(90deg)}}
  @keyframes fall{0%{transform:translate3d(0,-10vh,0) rotate(0)}100%{transform:translate3d(var(--dx),120vh,0) rotate(900deg)}}
  /* ---------- TOP BAR ---------- */
  .topbar{position:fixed;top:0;left:0;right:0;z-index:50}
  .topbar-inner{max-width:1440px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:clamp(14px,2.2vw,26px) clamp(16px,4vw,44px)}
  .logo{font-weight:800;font-size:clamp(13px,1.3vw,17px);color:#fff;white-space:nowrap}
  .logo b{color:rgba(255,255,255,.62)}
  .top-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .pill{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.38);backdrop-filter:blur(10px);
    padding:8px 16px;border-radius:999px;font-size:clamp(12.5px,1.1vw,15px);font-weight:800;color:#fff;white-space:nowrap}
  .pill .dot{width:7px;height:7px;border-radius:50%;background:#7CFFB2;box-shadow:0 0 8px #7CFFB2}
  .pill.white{background:#fff;color:var(--primary);border-color:#fff}
  .pill.warm{background:#FFF1C9;color:#8A5A00;border-color:#FFF1C9}
  .tab{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;padding:9px 18px;border-radius:999px;font-size:14px;font-weight:800;transition:.2s var(--ease)}
  .tab.on,.tab:hover{background:#fff;color:var(--primary)}
  /* ---------- LAYOUT ---------- */
  .page{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:clamp(76px,10vh,110px) clamp(16px,4vw,44px) 40px}
  .page.center{justify-content:center;text-align:center}
  .narrow{width:100%;max-width:560px}
  .wide{width:100%;max-width:1280px}
  .kicker{font-weight:800;font-size:clamp(14px,1.5vw,22px);color:rgba(255,255,255,.85);margin-bottom:clamp(12px,2.4vh,26px)}
  .hero-title{font-weight:900;line-height:1.08;font-size:clamp(46px,7.4vw,112px);color:#fff;word-break:keep-all;
    text-shadow:0 0 8px rgba(255,255,255,.6),0 0 28px rgba(160,180,255,.6),0 16px 42px rgba(1,20,120,.4);animation:titlePulse 1.25s ease-in-out infinite alternate}
  .hero-title .sub{display:block;font-size:.5em;margin-bottom:.18em;opacity:.95}
  .hero-title .tail{display:block;font-size:.5em;margin-top:.22em;opacity:.95}
  .lede{margin-top:clamp(16px,3vh,32px);color:#fff;font-size:clamp(17px,2vw,28px);font-weight:750;line-height:1.5;text-shadow:0 5px 24px rgba(1,20,120,.25)}
  .h2{font-weight:900;font-size:clamp(30px,4.4vw,64px);color:#fff;line-height:1.15;text-shadow:0 10px 36px rgba(1,20,120,.3);word-break:keep-all}
  .muted{color:rgba(255,255,255,.85);font-weight:700;font-size:clamp(15px,1.5vw,20px);line-height:1.5}
  @keyframes titlePulse{to{transform:scale(1.025);text-shadow:0 0 12px rgba(255,255,255,.85),0 0 40px rgba(170,190,255,.75),0 18px 48px rgba(1,20,120,.45)}}
  @keyframes contentIn{from{opacity:0;transform:scale(.7) translateY(50px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{opacity:0;transform:scale(.1) rotate(-12deg)}65%{opacity:1;transform:scale(1.18) rotate(3deg)}100%{opacity:1;transform:none}}
  .enter{animation:contentIn .8s cubic-bezier(.16,.9,.22,1.12) both}
  .pop{animation:pop .7s cubic-bezier(.12,.9,.2,1.25) both}
  /* ---------- PANEL / CARD ---------- */
  .panel{background:rgba(255,255,255,.97);border-radius:clamp(26px,3vw,40px);padding:clamp(22px,3.4vw,44px);color:var(--ink);box-shadow:0 34px 90px -34px rgba(1,10,90,.72)}
  .panel + .panel{margin-top:16px}
  .eyebrow{font-size:clamp(13px,1.2vw,17px);font-weight:900;color:var(--secondary)}
  .input{width:100%;height:64px;padding:0 20px;border:2px solid var(--g1);border-radius:18px;background:var(--g3);font-size:20px;font-weight:800;color:var(--ink);outline:none;text-align:center;transition:.2s var(--ease)}
  .input:focus{border-color:var(--secondary);background:#fff}
  .msg{color:var(--ng);font-size:14px;font-weight:700;min-height:20px;margin-top:8px}
  /* ---------- CTA ---------- */
  .cta{position:relative;overflow:hidden;width:100%;min-height:clamp(64px,8vh,92px);padding:16px 30px;border-radius:20px;background:#fff;color:var(--primary);
    font-weight:900;font-size:clamp(21px,2.4vw,32px);display:inline-flex;align-items:center;justify-content:center;gap:10px;
    box-shadow:0 22px 48px -18px rgba(1,10,90,.7);transition:.2s var(--ease)}
  .cta:hover:not(:disabled){background:var(--primary);color:#fff}
  .cta:active:not(:disabled){transform:scale(.98)}
  .cta:disabled{opacity:.45}
  .cta.shine::after{content:"";position:absolute;top:-60%;bottom:-60%;left:-35%;width:22%;background:rgba(255,255,255,.85);filter:blur(8px);transform:rotate(18deg);animation:shine 2.2s ease-in-out infinite}
  .cta.float{animation:ctaFloat 1.1s ease-in-out infinite alternate}
  .cta.blue{background:var(--primary);color:#fff}
  .cta.blue:hover:not(:disabled){background:var(--secondary)}
  .cta.glass{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.45);box-shadow:none}
  .cta.glass:hover:not(:disabled){background:#fff;color:var(--primary)}
  .cta.danger{background:#FFDDE4;color:#8B1E32}
  .cta.danger:hover:not(:disabled){background:#8B1E32;color:#fff}
  @keyframes shine{0%,22%{left:-35%}70%,100%{left:125%}}
  @keyframes ctaFloat{to{transform:translateY(-6px);box-shadow:0 30px 60px -20px rgba(1,10,90,.8)}}
  /* ---------- TIMER RING ---------- */
  .ring{position:relative;width:var(--rs,120px);height:var(--rs,120px);flex-shrink:0}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:8}
  .ring .track{stroke:rgba(255,255,255,.3)}
  .ring .prog{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset .2s linear}
  .ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:calc(var(--rs,120px) * .3);color:#fff}
  .ring.danger .prog{stroke:#FF6B81}
  .ring.danger .num{color:#FFD2DA;animation:panic .6s ease-in-out infinite alternate}
  @keyframes panic{to{transform:scale(1.15)}}
  /* ---------- QUESTION ---------- */
  .qhead{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}
  .qtext{font-size:clamp(22px,2.6vw,46px);font-weight:900;line-height:1.38;word-break:keep-all;color:var(--ink)}
  .opts{display:grid;gap:12px;margin-top:16px}
  .opt{width:100%;min-height:68px;padding:14px 18px;border-radius:20px;background:#fff;color:var(--ink);font-size:clamp(17px,1.8vw,22px);font-weight:800;text-align:left;
    display:flex;align-items:center;gap:14px;box-shadow:0 18px 40px -22px rgba(1,10,90,.65);transition:.18s var(--ease);word-break:keep-all}
  @media (hover:hover) and (pointer:fine){
    .opt:hover:not(:disabled){transform:translateY(-3px);background:var(--primary);color:#fff}
    .opt:hover:not(:disabled) .no{background:#fff;color:var(--primary)}
  }
  .opt:active:not(:disabled){transform:scale(.97);background:var(--primary);color:#fff}
  .opt:active:not(:disabled) .no{background:#fff;color:var(--primary)}
  .opt:disabled{opacity:.5}
  .no{flex-shrink:0;width:38px;height:38px;border-radius:12px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px}
  .opt:nth-child(2) .no{background:var(--secondary)} .opt:nth-child(3) .no{background:#2848DF} .opt:nth-child(4) .no{background:#6E84FF}
  /* host big */
  .hq-wrap{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center}
  .hopts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}
  .hopt{position:relative;min-height:96px;padding:20px 26px;border-radius:26px;background:#fff;color:var(--ink);font-size:clamp(20px,2.2vw,32px);font-weight:900;
    display:flex;align-items:center;gap:16px;box-shadow:0 24px 54px -26px rgba(1,10,90,.7);transition:.35s var(--ease);word-break:keep-all}
  .hopt .no{width:52px;height:52px;border-radius:16px;font-size:24px}
  .hopt:nth-child(2) .no{background:var(--secondary)} .hopt:nth-child(3) .no{background:#2848DF} .hopt:nth-child(4) .no{background:#6E84FF}
  .hopt.dim{opacity:.35;transform:scale(.97)}
  .hopt.correct{background:var(--primary);color:#fff;box-shadow:0 0 0 6px rgba(255,255,255,.7),0 30px 60px -20px rgba(1,10,90,.8);transform:scale(1.02)}
  .hopt.correct .no{background:#fff;color:var(--primary)}
  .hopt .cnt{margin-left:auto;padding:6px 14px;border-radius:999px;background:var(--g2);color:var(--primary);font-size:.72em;white-space:nowrap}
  .hopt.correct .cnt{background:#fff}
  .short-box{margin-top:22px;padding:30px;border-radius:26px;background:var(--g2);text-align:center;font-size:clamp(20px,2.4vw,34px);font-weight:900;color:var(--primary)}
  .short-box.answer{background:var(--primary);color:#fff}
  .stats{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px;align-items:center}
  .stat{padding:14px 22px;border-radius:20px;background:var(--g2);font-weight:900;font-size:clamp(17px,1.8vw,24px);color:var(--ink)}
  .stat b{color:var(--primary)}
  .explain{margin-top:16px;padding:18px 22px;border-radius:20px;background:var(--g3);border:1px solid var(--g1);font-size:clamp(16px,1.8vw,24px);font-weight:700;line-height:1.5;color:var(--ink-body)}
  .explain b{color:var(--secondary)}
  /* ---------- RESULT ---------- */
  .big-emoji{font-size:clamp(64px,10vw,110px);line-height:1}
  .result-title{font-size:clamp(42px,7vw,86px);font-weight:900;color:#fff;text-shadow:0 0 18px rgba(255,255,255,.7),0 14px 40px rgba(1,20,120,.45)}
  .point-pill{display:inline-block;margin-top:14px;padding:12px 28px;border-radius:999px;background:#fff;color:var(--primary);font-size:clamp(24px,4vw,40px);font-weight:900;box-shadow:0 18px 44px -18px rgba(1,10,90,.7)}
  .point-pill.ng{color:var(--ng)}
  /* ---------- RANKING ---------- */
  .rank-list{display:flex;flex-direction:column;gap:10px;width:100%}
  .rank-row{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:12px;padding:14px 20px;border-radius:20px;background:#fff;color:var(--ink);
    font-size:clamp(17px,1.9vw,26px);font-weight:850;box-shadow:0 14px 34px -22px rgba(1,10,90,.6)}
  .rank-row .r{font-weight:900;color:var(--secondary);text-align:center}
  .rank-row .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rank-row .s{font-weight:900;color:var(--primary)}
  .rank-row.me{box-shadow:0 0 0 4px var(--secondary),0 14px 34px -22px rgba(1,10,90,.6)}
  .rank-row.rank1{background:linear-gradient(135deg,var(--gold1),var(--gold2));font-size:clamp(20px,2.4vw,32px);padding:18px 22px;transform:scale(1.03)}
  .rank-row.rank2{background:linear-gradient(135deg,var(--silver1),var(--silver2));font-size:clamp(19px,2.2vw,29px)}
  .rank-row.rank3{background:linear-gradient(135deg,var(--bronze1),var(--bronze2));font-size:clamp(18px,2vw,28px)}
  .rank-row.rank1 .r,.rank-row.rank2 .r,.rank-row.rank3 .r{font-size:1.3em}
  .podium{display:flex;align-items:flex-end;justify-content:center;gap:clamp(12px,2vw,26px);margin:26px 0 8px;min-height:clamp(320px,48vh,470px)}
  .pcol{width:clamp(180px,22vw,290px);display:flex;flex-direction:column;align-items:center}
  .pcard{width:100%;padding:18px 14px;margin-bottom:14px;border-radius:26px;background:#fff;text-align:center;box-shadow:0 26px 60px -24px rgba(1,10,90,.75)}
  .pcard .medal{font-size:clamp(34px,4vw,54px);line-height:1}
  .pcard .pname{margin-top:6px;font-size:clamp(22px,2.6vw,36px);font-weight:900;color:var(--ink);word-break:break-all}
  .pcard .pscore{margin-top:4px;font-size:clamp(15px,1.5vw,20px);font-weight:800;color:var(--secondary)}
  .pcard.hidden{background:rgba(255,255,255,.2);border:2px dashed rgba(255,255,255,.6);box-shadow:none}
  .pcard.hidden .pname{color:#fff}
  .pbar{width:100%;border-radius:22px 22px 0 0;display:flex;justify-content:center;padding-top:16px;font-size:clamp(40px,5vw,66px);font-weight:900;color:rgba(11,20,70,.75)}
  .p1 .pbar{height:clamp(170px,24vh,250px);background:linear-gradient(180deg,var(--gold2),#F2C94C)}
  .p2 .pbar{height:clamp(120px,17vh,180px);background:linear-gradient(180deg,#EEF2F8,var(--silver2))}
  .p3 .pbar{height:clamp(90px,12vh,135px);background:linear-gradient(180deg,var(--bronze2),#D99B64)}
  /* ---------- LOBBY ---------- */
  .lobby{display:grid;grid-template-columns:auto 1fr;gap:clamp(24px,4vw,56px);align-items:center;width:100%}
  .qr{padding:18px;border-radius:32px;background:#fff;box-shadow:0 34px 90px -34px rgba(1,10,90,.75)}
  .qr img{display:block;width:clamp(220px,24vw,320px);height:auto;border-radius:12px}
  .qr-cap{margin-top:10px;text-align:center;font-size:14px;font-weight:900;color:var(--primary)}
  .count-big{font-size:clamp(56px,8vw,120px);font-weight:900;color:#fff;line-height:1;text-shadow:0 0 18px rgba(255,255,255,.6)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;max-height:34vh;overflow:auto}
  .chip{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(10px);padding:8px 16px;border-radius:999px;font-size:clamp(14px,1.3vw,18px);font-weight:800;color:#fff}
  .chip.off{opacity:.45}
  /* ---------- HOST ACTION BAR ---------- */
  .actions{width:100%;max-width:1280px;margin-top:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
  .subactions{width:100%;max-width:1280px;margin-top:14px;display:flex;justify-content:flex-end;gap:10px}
  .ghost{height:46px;padding:0 20px;border-radius:999px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);color:#fff;font-size:14px;font-weight:800;transition:.2s var(--ease)}
  .ghost:hover{background:#fff;color:var(--primary)}
  .ghost.red{background:#B42335;border-color:#B42335}
  .ghost.red:hover{background:#7F1424;color:#fff}
  /* ---------- EDITOR ---------- */
  .esec h2{font-size:clamp(22px,2.4vw,30px);font-weight:900;color:var(--ink);margin-bottom:14px}
  .esec h2 small{font-size:.6em;color:var(--ink-mute)}
  .eq{border:1.5px solid var(--g1);border-radius:22px;padding:18px;margin-bottom:12px;background:var(--g3)}
  .eq .head{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
  .eq .head b{flex:1;font-size:18px;color:var(--primary)}
  .eq textarea,.eq input[type=text],.eq input[type=number],.eq select,.jsonbox{width:100%;padding:11px 13px;border:1.5px solid var(--g1);border-radius:12px;background:#fff;font-size:15px;color:var(--ink);outline:none}
  .eq textarea:focus,.eq input:focus,.eq select:focus{border-color:var(--secondary)}
  .eq label{display:block;margin:10px 0 5px;font-size:13px;font-weight:800;color:var(--ink-mute)}
  .orow{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .orow input[type=radio]{width:22px;height:22px;accent-color:var(--primary);flex-shrink:0}
  .sbtn{height:36px;padding:0 14px;border-radius:999px;background:var(--g2);color:var(--ink);font-size:13.5px;font-weight:800}
  .sbtn:hover{background:var(--g1)}
  .sbtn.red{background:#FFE4E9;color:#B42335}
  .sbtn.blue{background:var(--primary);color:#fff}
  .movebox{display:flex;align-items:center;gap:4px}
  .movebox input{width:52px;height:36px;padding:0 6px;text-align:center;border:1.5px solid var(--g1);border-radius:10px;font-size:13.5px;font-weight:800;color:var(--ink)}
  .savebar{position:sticky;bottom:12px;z-index:5;margin-top:16px;padding:14px;border-radius:26px;background:rgba(11,20,70,.82);backdrop-filter:blur(14px);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .savebar .cta{width:auto;min-height:56px;font-size:18px;padding:0 26px}
  .dirty{color:#FFD166;font-weight:800}
  .clean{color:rgba(255,255,255,.75);font-weight:700}
  .autosaved{color:#7CFFB2;font-weight:800}
  .warnbox{margin-bottom:14px;padding:14px 20px;border-radius:18px;background:#FFF1C9;color:#8A5A00;font-weight:800}
  /* ---------- IMAGES ---------- */
  .qimg{display:block;width:auto;max-width:100%;margin-left:auto;margin-right:auto;height:auto;max-height:48vh;object-fit:contain;border-radius:20px;background:var(--g2);margin-bottom:16px}
  .zoom{cursor:zoom-in}
  .opts.img{grid-template-columns:1fr 1fr}
  .opt.img{flex-direction:column;align-items:stretch;padding:10px;gap:8px}

/* 사진 압축 (Firebase 용량 절약) */
function compressImage(file, max){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image();
      img.onload = () => { const r = Math.min(1, max / Math.max(img.width, img.height));
        const w = Math.round(img.width*r), hh = Math.round(img.height*r);
        const c = document.createElement("canvas"); c.width = w; c.height = hh;
        const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0,0,w,hh); x.drawImage(img,0,0,w,hh);
        res(c.toDataURL("image/jpeg", 0.8)); };
      img.onerror = () => rej(new Error("img")); img.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
function pickImage(max, cb){
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*";

/* ============ 사운드 (외부 파일 없이 코드로 생성하는 효과음 + 배경음악) ============ */
let actx = null, masterGain = null, sfxGain = null, musicGain = null;
let soundOn = localStorage.getItem("cdq_sound") !== "0";
function ensureAudio(){
  if(!actx){
    actx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = actx.createGain(); masterGain.gain.value = soundOn ? 1 : 0; masterGain.connect(actx.destination);
    sfxGain = actx.createGain(); sfxGain.gain.value = 0.9; sfxGain.connect(masterGain);
    musicGain = actx.createGain(); musicGain.gain.value = 0.32; musicGain.connect(masterGain);
  }
  if(actx.state === "suspended") actx.resume().catch(()=>{});
  return actx;
}
function tone(dest, freq, t0, dur, type, peak, attack){
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || "sine"; o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(peak ?? 0.22, t0 + (attack ?? 0.012));
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(dest);
  o.start(t0); o.stop(t0 + dur + 0.03);
}
function noiseBurst(dest, t0, dur, peak, freq){
  const n = Math.max(1, Math.floor(actx.sampleRate * dur));
  const buf = actx.createBuffer(1, n, actx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
  const src = actx.createBufferSource(); src.buffer = buf;
  const filt = actx.createBiquadFilter(); filt.type = "bandpass"; filt.frequency.value = freq || 1400;
  const g = actx.createGain(); g.gain.setValueAtTime(peak ?? 0.22, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(filt); filt.connect(g); g.connect(dest);
  src.start(t0); src.stop(t0 + dur + 0.03);
}
/* --- 효과음 --- */
function sfxCorrect(){ if(!soundOn) return; ensureAudio(); const t = actx.currentTime;
  [523.25,659.25,783.99,1046.50].forEach((f,i) => tone(sfxGain, f, t + i*0.075, 0.5, "triangle", 0.22)); }

  tone(sfxGain, 207.65, t, 0.4, "sawtooth", 0.18); tone(sfxGain, 155.56, t + 0.11, 0.45, "sawtooth", 0.16); }

/* --- 배경음악 ---

   drum : 최종 순위 발표(1등 공개 전) — 두구두구 북소리 롤 */
const CALM_CHORDS = [[261.63,329.63,392.00,493.88],[220.00,261.63,329.63,392.00],[174.61,220.00,261.63,349.23],[196.00,246.94,293.66,392.00]];
const QUIZ_BARS = [
  [130.81,[523.25,659.25,783.99,659.25]],
  [110.00,[440.00,523.25,659.25,523.25]],
  [87.31, [349.23,440.00,523.25,440.00]],
  [98.00, [392.00,493.88,587.33,493.88]]
];
const QUIZ_BEAT = 0.25;
let bgmMode = null, bgmTimer = null, bgmIdx = 0, bgmNext = 0;
function calmStep(){
  const t = actx.currentTime, dur = 3.6;
  CALM_CHORDS[bgmIdx % CALM_CHORDS.length].forEach(f => tone(musicGain, f, t, dur, "sine", 0.05, 0.7));
  bgmIdx++;
  bgmTimer = setTimeout(calmStep, (dur - 0.25) * 1000);
}
function quizStep(){
  const t0 = Math.max(bgmNext, actx.currentTime + 0.05);
  const [bass, arp] = QUIZ_BARS[bgmIdx % QUIZ_BARS.length];
  for(let i=0;i<8;i++){
    const t = t0 + i*QUIZ_BEAT;
    if(i % 2 === 0) tone(musicGain, bass, t, QUIZ_BEAT*1.8, "triangle", 0.11, 0.005);
    tone(musicGain, arp[i % 4], t, QUIZ_BEAT*0.9, "square", 0.022, 0.004);

  }
  bgmIdx++;
  bgmNext = t0 + 8*QUIZ_BEAT;
  bgmTimer = setTimeout(quizStep, Math.max(50, (bgmNext - actx.currentTime - 0.3) * 1000));
}
function drumLoopStep(){
  const t0 = Math.max(bgmNext, actx.currentTime + 0.05);
  const cycle = 1.05, n = 11;
  for(let i=0;i<n;i++){
    const t = t0 + i*(cycle/n);
    noiseBurst(musicGain, t, (cycle/n)*0.85, 0.045 + (i/n)*0.055, 2000);
  }
  tone(musicGain, 110, t0 + cycle - 0.05, 0.18, "sine", 0.09, 0.004);

function checkPresence(){
  if(isHost || !connected || !myId || !P[myId]?.nick) return;
  if(myConnKey && P[myId].conns && P[myId].conns[myConnKey]) return;
  if(presenceOn) return;
  presenceOn = true;
  const c = push(ref(db, `players/${myId}/conns`));

  onDisconnect(c).remove();
  set(c, true).finally(() => { presenceOn = false; });
}
async function join(){
  const input = document.getElementById("nick");
  const msg = document.getElementById("nickmsg");
  const nick = input.value.trim();
  if(!nick){ msg.textContent = "닉네임을 입력해 주세요."; return; }
  if(nick.length > NICK_MAX){ msg.textContent = `닉네임은 ${NICK_MAX}자 이내로 입력해 주세요.`; return; }
  const btn = document.getElementById("joinbtn"); btn.disabled = true;
  try{
    const id = myId || ("p" + Math.random().toString(36).slice(2,10) + Date.now().toString(36));
    const nk = norm(nick).replace(/[.#$\[\]\/]/g, "_");
    const r = await runTransaction(ref(db, "nicks/" + nk), cur => (cur === null || cur === id) ? id : undefined);
    if(!r.committed){ msg.textContent = "이미 사용 중인 닉네임이에요. 다른 닉네임을 입력해 주세요."; btn.disabled = false; return; }
    myId = id; localStorage.setItem("cdq_pid", id);
    await set(ref(db, "players/" + id), { nick, score:0, totalTime:0, joinedAt: serverTimestamp() });
    checkPresence();
    render(true);
  }catch(e){
    msg.textContent = "접속 오류가 발생했어요. 네트워크(LTE/5G)를 확인해 주세요."; btn.disabled = false; console.error(e);

async function submit(val){
  if(submitting || S.phase !== "question") return;
  const q = curQ(); if(!q) return;
  const k = qKey();
  const elapsed = Math.max(0, now() - S.startAt);
  const dur = (S.duration || q.time || DEFAULT_TIME) * 1000;
  if(elapsed > dur + 500){ toast("시간이 초과되었어요."); return; }
  if(q.type === "short" && !String(val).trim()){ toast("정답을 입력해 주세요."); return; }
  const correct = q.type === "short"
    ? toArr(q.answers).some(a => norm(a) === norm(val))
    : Number(val) === Number(q.answer);
  const points = correct ? Math.round(BASE_POINT + SPEED_POINT * Math.max(0, 1 - elapsed/dur)) : 0;
  submitting = true;
  localAns = { key:k, v:val, correct, points, elapsed };
  render(true);
  try{
    const r = await runTransaction(ref(db, `answers/${k}/${myId}`),
      cur => cur === null ? { v:val, correct, points, elapsed, nick:P[myId]?.nick||"" } : undefined);
    if(r.committed && S.round === "main" && points > 0){
      await update(ref(db, "players/" + myId), { score: increment(points), totalTime: increment(elapsed) });
    }
  }catch(e){ console.error(e); toast("제출 오류! 다시 시도해 주세요."); localAns = null; }
  submitting = false; render(true);
}
function myAnswer(){

function myRank(){

async function sha256(t){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,"0")).join("");
}
async function checkPin(){
  const v = document.getElementById("pin").value;
  if(await sha256(v) === PIN_HASH){
    hostOK = true; sessionStorage.setItem("cdq_host","1");
    if(!Q) await set(ref(db, "questions"), DEFAULT_QUESTIONS);
    render(true);
  }else document.getElementById("pinmsg").textContent = "PIN이 올바르지 않습니다.";
}

function blankQ(type){ return type === "short" ? { type:"short", text:"", answers:[""], time:DEFAULT_TIME, explain:"" }
                                            : { type:"mc", text:"", options:["","","",""], answer:0, time:DEFAULT_TIME, explain:"" }; }

let autosaveTimer = null;
let lastSavedAt = 0;
function scheduleAutosave(){
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(async () => {
    if(!dirty || tab !== "edit") return;
    const ok = await saveDraft(true);
    if(ok){ lastSavedAt = Date.now(); if(tab === "edit") renderEditor(); }
    scheduleAutosave();
  }, AUTOSAVE_MS);
}

async function saveDraft(silent){
  const errs = [];
  const clean = {};
  for(const key of ["practice","main"]){
    clean[key] = toArr(draft[key]).map((q,i) => {
      const label = `${key==="main" ? "본 문제" : "연습문제"} ${i+1}번`;
      if(!String(q.text||"").trim()) errs.push(`${label}: 문제 내용이 비어 있습니다.`);
      const base = { type: q.type==="short" ? "short" : "mc", text:String(q.text||"").trim(), time: Math.min(120, Math.max(5, Number(q.time)||DEFAULT_TIME)), explain:String(q.explain||"").trim(), image:String(q.image||""), explainImage:String(q.explainImage||"") };
      if(q.type === "short"){
        const ans = toArr(q.answers).map(x => String(x).trim()).filter(Boolean);
        if(!ans.length) errs.push(`${label}: 인정 정답을 1개 이상 입력하세요.`);
        return { ...base, answers: ans };
      }
      const opts = toArr(q.options).map(x => String(x).trim());
      const ois = opts.map((_,j) => String(toArr(q.optImages)[j] || ""));
      const filled = opts.map((o,j) => !!(o || ois[j]));
      if(opts.length < 2) errs.push(`${label}: 보기를 2개 이상 입력하세요.`);
      if(filled.some(f => !f)) errs.push(`${label}: 비어 있는 보기가 있습니다. 글이나 사진을 넣거나 ✕로 삭제하세요.`);
      if(!filled[Number(q.answer)]) errs.push(`${label}: 정답을 선택하세요.`);
      const out = { ...base, options: opts, answer: Number(q.answer)||0 };
      if(ois.some(Boolean)) out.optImages = ois;
      return out;
    });
  }
  if(!clean.main.length) errs.push("본 문제가 1개 이상 필요합니다.");
  if(errs.length){
    if(silent){ console.warn("자동저장 보류 - 입력 오류:", errs); return false; }
    alert("저장할 수 없습니다.\n\n" + errs.join("\n")); return false;
  }
  const mb = JSON.stringify(clean).length / 1048576;
  if(!silent && mb > 8 && !confirm(`사진 용량이 약 ${mb.toFixed(1)}MB로 큽니다. 참가자 접속이 느려질 수 있어요. 그래도 저장할까요?`)) return false;
  if(!silent && ["question","reveal","board"].includes(S.phase) && !confirm("퀴즈 진행 중입니다. 그래도 저장할까요?")) return false;
  await set(ref(db, "questions"), clean);
  dirty = false;
  if(silent) toast("⏱ 5분 경과 - 자동저장되었습니다.");
  else { toast("저장했습니다. 모든 화면에 즉시 반영됩니다."); renderEditor(); }
  return true;
}
/* ============ 8. 타이머 & 렌더 ============ */
let lastTickSecond = null;
function tick(){
  if(S.phase !== "question" || !S.startAt) return;
  const dur = (S.duration || DEFAULT_TIME) * 1000;
  const left = Math.max(0, S.startAt + dur - now());
  const secLeft = Math.ceil(left / 1000);
  if(secLeft !== lastTickSecond){
    lastTickSecond = secLeft;
    if(secLeft > 0 && secLeft <= 5) sfxTick(secLeft <= 3);
  }
  document.querySelectorAll("[data-ring]").forEach(r => {
    r.querySelector("[data-prog]").style.strokeDashoffset = 326.7 * (1 - left/dur);
    r.querySelector("[data-num]").textContent = Math.ceil(left/1000);
    r.classList.toggle("danger", left <= 5000);
  });
  if(isHost && hostOK && left <= 0 && autoRevealed !== qKey()+S.startAt){
    autoRevealed = qKey()+S.startAt; setTimeout(() => { if(S.phase === "question") reveal(); }, 600);
  }
  if(!isHost && left <= 0 && !myAnswer()) $app.querySelectorAll(".opt,#sabtn").forEach(b => b.disabled = true);
}
setInterval(tick, 200);
function render(force){
  try{ isHost ? renderHost(force) : renderPlayer(force); }
  catch(e){ console.error(e); }
  try{ handleAudioSideEffects(); }catch(e){ console.error(e); }
}
</script>
